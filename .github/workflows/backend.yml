name: Backend CI/CD
on:
  push:
    branches: [main, dev, production]
  pull_request:
    branches: [main, dev, production]
    types: [opened, synchronize, reopened]

jobs:
  backend:
    name: Backend Build & Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend-flask
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        working-directory: backend-flask
        run: pytest --cov=. --cov-report=xml --cov-report=lcov -v

      # Create sonar config
      - name: Create sonar properties
        run: |
          cat > sonar-project.properties << 'EOL'
          sonar.organization=${{ secrets.SONAR_ORGANIZATION }}
          sonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          sonar.projectName=Backend App
          sonar.sources=backend-flask
          sonar.tests=backend-flask
          sonar.test.inclusions=**/*test*.py
          sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/venv/**
          sonar.python.coverage.reportPaths=backend-flask/coverage.xml
          sonar.sourceEncoding=UTF-8
          EOL

      # SonarCloud scan
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Snyk scan
      - name: Install Snyk CLI
        run: npm install -g snyk
      - name: Snyk Scan
        run: snyk test --org=${{ secrets.SNYK_ORG_ID }} --severity-threshold=critical --command=python3 || true
        working-directory: backend-flask
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
